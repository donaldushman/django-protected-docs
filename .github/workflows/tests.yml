name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "~=4.2.0"
          - python-version: "3.11"
            django-version: "~=5.0.0"
          - python-version: "3.11"
            django-version: "~=5.1.0"
          - python-version: "3.12"
            django-version: "~=5.2.0"
          - python-version: "3.12"
            django-version: "~=6.0.0"
          - python-version: "3.13"
            django-version: "~=6.0.0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "Django${{ matrix.django-version }}"
      - name: Run tests with coverage
        run: coverage run runtests.py
      - name: Report coverage
        run: coverage report --fail-under=95
